<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shalshelet Lite a changé d'adresse</title>
<meta name="theme-color" content="#11233D">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="canonical" href="https://saltielgiorno-source.github.io/shalshelet-lite/">
<style>
 body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #11233D; color: #F2EDE4; font: 17px/1.5 system-ui, sans-serif; text-align: center; }
 main { max-width: 26em; padding: 2em 1.5em; }
 a { color: #F4B83D; font-weight: 600; }
 p { margin: .6em 0; }
</style>
</head>
<body>
<main>
<p><strong>Shalshelet Lite</strong> a changé d'adresse.</p>
<p><a href="https://saltielgiorno-source.github.io/shalshelet-lite/">saltielgiorno-source.github.io/shalshelet-lite</a></p>
<p lang="en">Shalshelet Lite has moved.</p>
<p lang="es">Shalshelet Lite ha cambiado de dirección.</p>
<p lang="ru">Shalshelet Lite переехал на новый адрес.</p>
<p lang="he" dir="rtl">שלשלת לייט עברה לכתובת חדשה.</p>
</main>
<script>
// 26/11/2026 : la Lite vit désormais à sa propre adresse ; on retire l'ancien service worker de ce dossier, puis on y renvoie
try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (/\/allegee\/$/.test(r.scope)) r.unregister(); }); }); } catch (e) {}
setTimeout(function () { location.replace("https://saltielgiorno-source.github.io/shalshelet-lite/"); }, 1200);
</script>
</body>
</html>
